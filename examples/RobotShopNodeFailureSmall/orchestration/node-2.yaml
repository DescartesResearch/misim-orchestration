apiVersion: v1
kind: Node
metadata:
  name: large-node
  labels:
    kubernetes.io/hostname: large-node
spec:
  providerID: "clusterapi://large-node"
status:
  phase: Running
  conditions:
    - type: Ready
      status: "True"
  allocatable:
    cpu: "3"
    memory: "128G"
    pods: "120"
  capacity:
    cpu: "3"
    memory: "128G"
    pods: "120"
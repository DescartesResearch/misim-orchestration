apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    service: web
spec:
  replicas: 2
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      schedulerName: kube
      serviceAccountName: robot-shop
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: service
                    operator: In
                    values:
                      - web
              topologyKey: "kubernetes.io/hostname"
      initContainers:
        - name: check-shipping
          image: curlimages/curl:latest # Make sure the image has curl
          command: ['sh', '-c']
          args:
            - |
              until curl -XGET "http://shipping:8080/health" -f | grep -i "ok"; do
                echo 'waiting for shipping-service'
                sleep 5
              done

      containers:
        - name: web
          image: rs-web
          imagePullPolicy: Always
          env:
          - name: INSTANA_EUM_KEY
            value: "INSTANA_EUM_KEY"
          - name: INSTANA_EUM_REPORTING_URL
            value: "INSTANA_EUM_REPORTING_URL"
          - name: INSTANA_AGENT_HOST
            value: "INSTANA_AGENT_HOST"
          - name: INSTANA_AGENT_PORT
            value: "INSTANA_AGENT_PORT"
          - name: INSTANA_SERVICE_NAME
            value: nginx-web
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 200m
              memory: 100Mi
            requests:
              cpu: 200m
              memory: 100Mi
      restartPolicy: Always
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  labels:
    service: shipping
spec:
  replicas: 4
  selector:
    matchLabels:
      service: shipping
  template:
    metadata:
      labels:
        service: shipping
    spec:
      nodeSelector:
        node-role: worker
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: service
                    operator: In
                    values:
                      - shipping
              topologyKey: "kubernetes.io/hostname"
      schedulerName: kube
      initContainers:
        - name: wait-for-mysql
          image: mysql:5.7
          command:
            - sh
            - -c
            - |
              until mysql -h mysql -e "SELECT 1 FROM information_schema.tables WHERE table_schema = 'cities' AND table_name = 'cities' LIMIT 1;" ; do
                echo 'waiting for cities.cities table';
                sleep 2;
              done
      serviceAccountName: robot-shop
      containers:
        - name: shipping
          image: rs-shipping
          imagePullPolicy: Always
          command:
            - "java"
            - "-XX:InitialRAMPercentage=33"
            - "-XX:MaxRAMPercentage=75"
            - "-jar"
            - "shipping.jar"
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 4Gi
            requests:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            successThreshold: 1
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
      restartPolicy: Always
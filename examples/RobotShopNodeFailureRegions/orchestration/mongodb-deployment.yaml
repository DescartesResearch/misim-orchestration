apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    service: mongodb
spec:
  replicas: 4
  selector:
    matchLabels:
      service: mongodb
  template:
    metadata:
      labels:
        service: mongodb
    spec:
      nodeSelector:
        node-role: worker
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: service
                    operator: In
                    values:
                      - mongodb
              topologyKey: "kubernetes.io/hostname"
      serviceAccountName: robot-shop
      schedulerName: kube
      containers:
        - name: mongodb
          image: rs-mongodb
          imagePullPolicy: Always
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
      restartPolicy: Always
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  labels:
    service: catalogue
spec:
  replicas: 4
  selector:
    matchLabels:
      service: catalogue
  template:
    metadata:
      labels:
        service: catalogue
    spec:
      nodeSelector:
        node-role: worker
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: service
                    operator: In
                    values:
                      - catalogue
              topologyKey: "kubernetes.io/hostname"
      serviceAccountName: robot-shop
      schedulerName: kube
      initContainers:
        - name: check-mongodb
          image: mongoclient/mongoclient:latest
          command:
            - sh
            - -c
            - |
              until mongo --host mongodb:27017 --eval "db = db.getSiblingDB('catalogue'); if (db.stats().ok == 0) { quit(1); }"; do
                echo 'waiting for mongodb'
                sleep 5
              done
      containers:
        - name: catalogue
          image: rs-catalogue
          imagePullPolicy: Always
          env:
            - name: INSTANA_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 100m
              memory: 100Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl http://localhost:8080/health | grep -q true'
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always